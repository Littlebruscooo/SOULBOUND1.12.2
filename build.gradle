// ForgeGradle 2.3 build for Minecraft 1.12.2. Needs JDK 8 and Gradle 4.9 (the Forge 1.12.2 MDK ships a matching wrapper).
// Easiest route: download the 1.12.2 MDK from files.minecraftforge.net, then copy this project's `src/` folder
// (and LICENSE file) over the MDK's `src/`. This build.gradle is provided for reference / convenience.
buildscript {
    repositories {
        jcenter()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "0.1.0"
group = "com.pixelcite.turnbattle"
archivesBaseName = "turnbattle-remake-1.12.2"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
